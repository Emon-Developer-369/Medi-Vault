{% extends "base.html" %}
{% block title %}{{ code }} {{ title }} - Medi Vault{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="mv-card p-5 text-center fade-up">
      <div class="display-1 fw-bold text-gradient mb-2">{{ code }}</div>
      <h1 class="h3 fw-bold">{{ title }}</h1>
      <p class="text-body-secondary mb-4">{{ message }}</p>
      <div class="d-flex justify-content-center gap-2">
        <a href="/" class="btn btn-gradient rounded-pill px-4"><i class="bi bi-house me-1" aria-hidden="true"></i>Go home</a>
        <button type="button" class="btn btn-outline-secondary rounded-pill px-4 js-back"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Go back</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

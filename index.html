<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Medi Vault - secure medical records vault for patients, documents, prescriptions and audit trails.">
  <meta name="theme-color" content="#17324D">
  <title>Medi Vault</title>
  <script src="/static/js/theme.js?v=4"></script>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/static/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/app.css?v=4">
</head>
<body>
<a class="visually-hidden-focusable position-absolute top-0 start-0 m-2 btn btn-light" href="#main">Skip to content</a>

<div id="nav-root"></div>

<div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container" aria-live="polite" aria-atomic="true"></div>

<main id="main" class="container py-4 py-lg-5"></main>

<div class="modal fade" id="confirm-modal" tabindex="-1" aria-labelledby="modal-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 rounded-4 shadow-lg">
      <div class="modal-header border-0 pb-0">
        <h2 class="modal-title fs-5 fw-bold" id="modal-title">Confirm Action</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close dialog"></button>
      </div>
      <div class="modal-body">
        <p class="modal-body-text mb-0">Are you sure you want to proceed?</p>
        <div id="modal-reason-container" class="mt-3 d-none">
          <label for="modal-reason-input" class="form-label">Reason (optional, max 200 characters)</label>
          <input id="modal-reason-input" class="form-control" placeholder="e.g. Completed course, allergy, changed dose..." maxlength="200">
        </div>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger rounded-pill px-4 modal-confirm-btn">Confirm</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="file-viewer-modal" tabindex="-1" aria-labelledby="file-viewer-title" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content border-0 rounded-4 shadow-lg">
      <div class="modal-header border-0">
        <h2 class="modal-title fs-5 fw-bold" id="file-viewer-title">Document Preview</h2>
        <div class="d-flex align-items-center gap-2 ms-auto">
          <a id="file-viewer-download" href="#" download class="btn btn-sm btn-outline-primary rounded-pill px-3"><i class="bi bi-download me-1" aria-hidden="true"></i>Download</a>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close preview"></button>
        </div>
      </div>
      <div class="modal-body p-0" id="file-viewer-body" style="min-height: 70vh; background: var(--mv-surface-2);"></div>
    </div>
  </div>
</div>

<footer class="mv-footer">
  <div class="wrap">
    <div>
      <strong>Medi Vault</strong>
      <small>Healthcare records platform · Synthetic data only</small>
    </div>
    <div class="d-flex align-items-center gap-3">
      <a href="/#security">Security &amp; privacy</a>
      <button type="button" class="btn btn-link p-0 text-decoration-none" id="reset-demo-btn" style="color: #9fd8d1; font-size: 13px;">Reset demo data</button>
    </div>
  </div>
</footer>

<script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/static/js/db.js?v=1"></script>
<script src="/static/js/auth.js?v=1"></script>
<script src="/static/js/views.js?v=1"></script>
<script src="/static/js/app.js?v=4"></script>
</body>
</html>

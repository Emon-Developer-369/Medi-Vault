services:
  - type: web
    name: medi-vault
    runtime: python
    rootDir: Medi_vault_Emon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MEDIVAULT_DB
        value: /var/data/medivault.db
      - key: MEDIVAULT_UPLOADS
        value: /var/data/private_uploads
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
    disk:
      name: medi-vault-data
      mountPath: /var/data
      sizeGB: 1
